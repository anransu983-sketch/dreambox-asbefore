name: Build NodeForge pack

# 一键节点功能包：纯静态 web + Java/JSch 编 dex，不需要 Node 与芷湘仓库。
on:
  workflow_dispatch:

jobs:
  build-pack:
    name: Build nodeforge pack
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout DreamBox
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # v3 会去装已被谷歌下架的 legacy 'tools' 包而失败（首跑实测）；
      # 用芷湘包验证过的 v4 + packages 写法。
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Build pack zip
        run: bash packs/nodeforge/build-pack.sh

      - name: Upload pack artifact
        uses: actions/upload-artifact@v4
        with:
          name: nodeforge-pack
          path: packs/nodeforge/nodeforge-pack-v*.zip

      - name: Publish pack to packs release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view packs >/dev/null 2>&1 || \
            gh release create packs --title "功能包" --notes "梦盒功能包下载（App 内功能包页使用）"
          gh release upload packs packs/nodeforge/nodeforge-pack-v*.zip --clobber
