name: Build DreamBox APK

# 手动触发：Actions 页选这个 workflow 点 Run workflow
on:
  workflow_dispatch:
    inputs:
      custom_icon:
        description: "定制图标构建（用 custom-icon/icon.png 生成图标，产物发到 custom-icon 预发布）"
        type: boolean
        default: false

jobs:
  geo:
    name: Geo assets
    uses: ./.github/workflows/reusable-build-geo.yml
    with:
      channel: dreambox
    secrets: inherit

  native-arm64:
    name: Native arm64-v8a
    uses: ./.github/workflows/reusable-build-native-abi.yml
    with:
      channel: dreambox
      kernel_channel: alpha
      abi: arm64-v8a
    secrets: inherit

  apk:
    name: Build loader APK
    needs: [geo, native-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Generate custom icon (workshop)
        if: ${{ inputs.custom_icon }}
        shell: bash
        run: |
          python3 -m pip install --quiet pillow
          python3 scripts/gen_custom_icon.py

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26"

      - name: Setup Kotlin
        uses: fwilhe2/setup-kotlin@main

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Restore debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: dreambox-debug-keystore-v1

      - name: Prepare loader signing (debug keystore as release keystore)
        env:
          KS_PASSPHRASE: ${{ secrets.DREAMBOX_KS_PASSPHRASE }}
        shell: bash
        run: |
          set -eu
          mkdir -p ~/.android signing
          if [ -f signing/debug.keystore.enc ] && [ -n "${KS_PASSPHRASE:-}" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in signing/debug.keystore.enc -out ~/.android/debug.keystore -pass env:KS_PASSPHRASE
            echo "keystore restored from encrypted repo backup"
          elif [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10950 -dname "CN=Android Debug,O=Android,C=US"
            echo "debug keystore missing (cache lost); generated a fresh one"
          fi
          cp ~/.android/debug.keystore release.keystore
          keytool -list -keystore release.keystore -storepass android -alias androiddebugkey > /dev/null
          printf 'keystore.password=android\nkey.alias=androiddebugkey\nkey.password=android\n' > signing.properties
          echo "signing prepared"
          FP=$(keytool -list -v -keystore release.keystore -storepass android -alias androiddebugkey | grep -i "SHA256:" | head -1 | sed "s/.*SHA256: *//" | tr -d ":" | tr "A-F" "a-f")
          if [ "$FP" != "97e0ba49e4e5a30cd481c0cb5e79fc0fafd07ad1d996fb89ff78e3d43689dafd" ]; then
            echo "::error::signing certificate mismatch ($FP) - refusing to sign with an unpinned key"
            exit 1
          fi
          if [ ! -f signing/debug.keystore.enc ] && [ -n "${KS_PASSPHRASE:-}" ]; then
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in ~/.android/debug.keystore -out signing/debug.keystore.enc -pass env:KS_PASSPHRASE
            git config user.name "dreambox-ci"
            git config user.email "ci@suanran9527.com"
            git add signing/debug.keystore.enc
            git commit -m "chore(ci): 签名密钥加密备份入库（防缓存丢失重演换签）" || true
            git push origin HEAD:main || echo "::warning::encrypted keystore backup push failed; will retry on next run"
          fi

      - name: Download native arm64 artifact
        uses: actions/download-artifact@v8
        with:
          name: native-dreambox-arm64-v8a
          path: _artifacts/native

      - name: Download core version stamp
        uses: actions/download-artifact@v8
        with:
          name: native-dreambox-core-stamp
          path: _artifacts/stamp

      - name: Download geo artifact
        uses: actions/download-artifact@v8
        with:
          name: native-dreambox-geo
          path: _artifacts/geo

      - name: Stage native libs and geo assets
        shell: bash
        run: |
          set -eu
          mkdir -p jniLibs/arm64-v8a
          cp _artifacts/native/*.so jniLibs/arm64-v8a/
          mkdir -p build/generated
          cp _artifacts/stamp/core-version.properties build/generated/core-version.properties
          mkdir -p build/generated/assets/geo
          cp _artifacts/geo/* build/generated/assets/geo/
          # 1.40 起不打包 BundleMRS.7z（8.9MB 离线规则包）：App 代码无任何引用，
          # 规则集走远程 rule-provider、geo 数据有内置下载通道，属白带重量。
          rm -f build/generated/assets/geo/BundleMRS.7z
          echo "--- jniLibs ---"
          ls -la jniLibs/arm64-v8a
          echo "--- geo ---"
          ls -la build/generated/assets/geo

      - name: Build loader APK
        id: gradle_build
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease 2>&1 | tee gradle-build.log

      - name: Report build error log
        if: failure() && steps.gradle_build.outcome == 'failure'
        shell: bash
        run: |
          python3 - <<'EOF'
          import re
          txt = open('gradle-build.log', encoding='utf-8', errors='replace').read()
          lines = txt.splitlines()
          out, cap = [], False
          for ln in lines:
              if '* What went wrong:' in ln:
                  cap = True
              if cap:
                  out.append(ln)
                  if len(out) > 80:
                      break
          errs = [ln for ln in lines if re.match(r'^e: ', ln) or 'FAILED' in ln or 'error:' in ln.lower()]
          with open('.github/build-error.log', 'w', encoding='utf-8') as f:
              f.write('=== What went wrong ===\n')
              f.write('\n'.join(out) + '\n')
              f.write('\n=== e: / FAILED lines ===\n')
              f.write('\n'.join(errs[:120]) + '\n')
          EOF
          git config user.name "dreambox-ci"
          git config user.email "ci@dreambox.local"
          git add -f .github/build-error.log
          git commit -m "ci: build error log [skip ci]" || true
          git push origin HEAD:main || true

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          retention-days: 3
          name: dreambox-debug-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          compression-level: 0

      - name: Publish version release (draft)
        if: ${{ !inputs.custom_icon }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          ver=$(grep -E '^project\.version\.name=' gradle.properties | cut -d= -f2)
          ts=$(TZ=Asia/Shanghai date +%Y%m%d%H%M)
          sha=$(git rev-parse --short=6 HEAD)
          src=$(ls app/build/outputs/apk/release/*.apk | head -1)
          asset="DreamBox-builtin-arm64-v8a-release-${ts}-${sha}.apk"
          cp "$src" "$asset"
          if gh release view "v${ver}" >/dev/null 2>&1; then
            gh release upload "v${ver}" "$asset" --clobber
          else
            gh release create "v${ver}" --draft --title "梦盒 ${ver}" --notes "CI 构建完成，待验包后转正。" "$asset"
          fi
          echo "draft release v${ver} now carries ${asset}"

      - name: Publish custom icon build
        if: ${{ inputs.custom_icon }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view custom-icon >/dev/null 2>&1 || \
            gh release create custom-icon --prerelease --title "梦盒定制图标版" \
              --notes "工坊构建：自定义应用图标。与正式版同版本同签名，覆盖安装即可；想换回正式版就装正式版 Release。"
          gh release upload custom-icon app/build/outputs/apk/release/*.apk --clobber
