# ============================================================
# 梦盒「一键节点」生成的单节点配置（按 4837 v2 模板：sniffer + 防 DNS 泄露 + STUN 拦截防 WebRTC）
# ============================================================

allow-lan: false
global-client-fingerprint: chrome
keep-alive-interval: 30
profile:
  store-selected: true
  store-fake-ip: true
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080]
      override-destination: true
dns:
  default-nameserver:
  - 8.8.8.8
  - 1.1.1.1
  enable: true
  enhanced-mode: fake-ip
  fake-ip-filter:
  - '*.lan'
  - localhost
  - '*.local'
  fake-ip-range: 198.18.0.1/16
  fallback:
  - https://9.9.9.9/dns-query
  - https://149.112.112.112/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
    - 240.0.0.0/4
  ipv6: false
  respect-rules: true
  proxy-server-nameserver:
  - https://doh.pub/dns-query
  direct-nameserver:
  - https://doh.pub/dns-query
  nameserver:
  - https://1.1.1.1/dns-query
  - https://8.8.8.8/dns-query
  nameserver-policy:
    '+.cn':
    - https://doh.pub/dns-query
external-controller: 127.0.0.1:9090
secret: ''
log-level: info
mixed-port: 7890
mode: rule
unified-delay: true
tcp-concurrent: true
proxies:
- name: {{NODE_NAME}}
  type: vless
  server: {{SERVER}}
  port: {{PORT}}
  uuid: {{UUID}}
  tls: true
  servername: www.microsoft.com
  client-fingerprint: chrome
  flow: xtls-rprx-vision
  reality-opts:
    public-key: {{PUBLIC_KEY}}
    short-id: "{{SHORT_ID}}"
proxy-groups:
- name: Proxy
  type: select
  proxies:
  - Auto
  - {{NODE_NAME}}
- name: Auto
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  proxies:
  - {{NODE_NAME}}
- name: 🎮 Steam
  type: select
  proxies:
  - Proxy
  - {{NODE_NAME}}
  - DIRECT
  - Auto
- name: 🎬 Emby
  type: select
  proxies:
  - Proxy
  - {{NODE_NAME}}
  - DIRECT
- name: 📺 YouTube
  type: select
  proxies:
  - Proxy
  - {{NODE_NAME}}
  - Auto
- name: ✈️ Telegram
  type: select
  proxies:
  - Proxy
  - {{NODE_NAME}}
  - Auto
- name: 🤖 AI 增强
  type: select
  proxies:
  - Proxy
  - {{NODE_NAME}}
  - Auto
  - DIRECT
- name: 🐟 漏网之鱼
  type: select
  proxies:
  - Proxy
  - {{NODE_NAME}}
  - DIRECT
rules:
- GEOIP,Private,DIRECT
- DOMAIN-SUFFIX,local,DIRECT
- IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
- IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
- IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
- DOMAIN-KEYWORD,stun,REJECT
- DST-PORT,3478,REJECT
- DST-PORT,3479,REJECT
- DST-PORT,5349,REJECT
- DST-PORT,19302,REJECT
- DST-PORT,19305,REJECT
- DOMAIN-SUFFIX,openai.com,🤖 AI 增强
- DOMAIN-SUFFIX,chatgpt.com,🤖 AI 增强
- DOMAIN-SUFFIX,anthropic.com,🤖 AI 增强
- DOMAIN-SUFFIX,claude.ai,🤖 AI 增强
- DOMAIN-SUFFIX,gemini.google.com,🤖 AI 增强
- DOMAIN-SUFFIX,t.me,✈️ Telegram
- DOMAIN-SUFFIX,tdesktop.com,✈️ Telegram
- DOMAIN-SUFFIX,telegra.ph,✈️ Telegram
- DOMAIN-SUFFIX,telegram.me,✈️ Telegram
- DOMAIN-SUFFIX,telegram.org,✈️ Telegram
- IP-CIDR,91.108.4.0/22,✈️ Telegram,no-resolve
- IP-CIDR,91.108.8.0/22,✈️ Telegram,no-resolve
- IP-CIDR,91.108.12.0/22,✈️ Telegram,no-resolve
- IP-CIDR,91.108.16.0/22,✈️ Telegram,no-resolve
- IP-CIDR,91.108.20.0/22,✈️ Telegram,no-resolve
- IP-CIDR,91.108.56.0/22,✈️ Telegram,no-resolve
- IP-CIDR,149.154.160.0/20,✈️ Telegram,no-resolve
- DOMAIN-SUFFIX,youtube.com,📺 YouTube
- DOMAIN-SUFFIX,youtu.be,📺 YouTube
- DOMAIN-SUFFIX,googlevideo.com,📺 YouTube
- DOMAIN-SUFFIX,ytimg.com,📺 YouTube
- DOMAIN-SUFFIX,steampowered.com,🎮 Steam
- DOMAIN-SUFFIX,steamcommunity.com,🎮 Steam
- DOMAIN-SUFFIX,steamgames.com,🎮 Steam
- DOMAIN-SUFFIX,steamusercontent.com,🎮 Steam
- DOMAIN-SUFFIX,steamcontent.com,🎮 Steam
- DOMAIN-SUFFIX,steamstatic.com,🎮 Steam
- DOMAIN-SUFFIX,steamcdn-a.akamaihd.net,🎮 Steam
- DOMAIN-KEYWORD,emby,🎬 Emby
- GEOIP,CN,DIRECT
- MATCH,🐟 漏网之鱼
tun:
  auto-detect-interface: true
  auto-route: true
  dns-hijack:
  - any:53
  enable: true
  stack: system