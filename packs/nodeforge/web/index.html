<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>一键节点</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; font-family: sans-serif; background: #14101c; color: #f2eef8; }
  h1 { font-size: 19px; margin: 4px 0 2px; }
  .sub { color: #b9aed0; font-size: 12.5px; line-height: 1.55; margin-bottom: 14px; }
  .card { background: #1f1930; border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  label { display: block; font-size: 12.5px; color: #b9aed0; margin: 10px 0 5px; }
  label:first-child { margin-top: 0; }
  input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #3a3054;
          background: #171226; color: #fff; font-size: 15px; outline: none; }
  input:focus { border-color: #e88bb0; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  button.main { width: 100%; padding: 13px; border: 0; border-radius: 12px; margin-top: 14px;
    background: linear-gradient(90deg, #e88bb0, #a678e8); color: #fff; font-size: 16px; font-weight: 600; }
  button.main:disabled { opacity: .45; }
  button.mini { padding: 7px 12px; border-radius: 9px; border: 1px solid #4a3d6e; background: #2a2142;
    color: #e8defc; font-size: 13px; margin: 6px 6px 0 0; }
  pre { white-space: pre-wrap; word-break: break-all; font-size: 12px; line-height: 1.5;
    background: #100c1a; border-radius: 10px; padding: 10px; max-height: 300px; overflow: auto; margin: 0; }
  .kv { font-size: 13.5px; line-height: 1.65; word-break: break-all; }
  .kv b { color: #b9aed0; font-weight: 500; }
  .warn { color: #ffc46b; font-size: 12.5px; line-height: 1.55; }
  .err { color: #ff8f8f; }
  .hidden { display: none; }
  textarea { width: 100%; height: 180px; border-radius: 10px; border: 1px solid #3a3054;
    background: #100c1a; color: #d9f2d9; font-size: 11px; padding: 10px; }
</style>
</head>
<body>
<h1>🚀 一键节点</h1>
<div class="sub">填服务器信息，一键装好 s-ui + VLESS+Reality（全自动，约 1–3 分钟）。<br>
面板默认只绑本机回环、公网打不开，管理走 SSH 隧道；root 密码只在内存里用，不保存。</div>

<div class="card" id="formCard">
  <label>服务器 IP / 域名</label>
  <input id="host" placeholder="如 1.2.3.4" autocomplete="off">
  <div class="row">
    <div><label>SSH 端口</label><input id="sshPort" type="number" value="22"></div>
    <div><label>SSH 用户</label><input id="sshUser" value="root"></div>
  </div>
  <label>root 密码（SSH 登录密码）</label>
  <input id="sshPassword" type="password" placeholder="服务器的 root 密码" autocomplete="off">
  <label>节点备注名（显示在链接和配置里）</label>
  <input id="nodeName" placeholder="如 🇺🇸 新节点" autocomplete="off">
  <div class="row">
    <div><label>节点端口</label><input id="nodePort" type="number" value="443"></div>
    <div><label>订阅 ID（英文/数字）</label><input id="subId" placeholder="node1" autocomplete="off"></div>
  </div>
  <div class="row">
    <div><label>面板管理员账号</label><input id="adminUser" value="sui" autocomplete="off"></div>
    <div><label>面板管理员密码（记好）</label><input id="adminPass" autocomplete="off"></div>
  </div>
  <button class="main" id="deployBtn">一键部署</button>
  <div class="warn" style="margin-top:10px">云厂商控制台的安全组记得放行节点端口与订阅端口（2096），机内防火墙脚本会自动处理。</div>
</div>

<div class="card hidden" id="logCard">
  <label style="margin-top:0">部署进度</label>
  <pre id="log"></pre>
</div>

<div class="card hidden" id="resultCard">
  <div class="kv" id="resultKv"></div>
  <div>
    <button class="mini" id="copyVless">复制 vless 链接</button>
    <button class="mini" id="copySub">复制订阅链接</button>
    <button class="mini" id="copyTunnel">复制面板隧道命令</button>
  </div>
  <label>梦盒配置（按 4837 v2 模板：防 DNS 泄露 / 防 WebRTC）</label>
  <textarea id="yaml" readonly></textarea>
  <div>
    <button class="mini" id="copyYaml">复制配置</button>
    <button class="mini" id="dlYaml">下载 .yaml</button>
  </div>
  <div class="warn" style="margin-top:8px">配置导入梦盒后即可用。注意：订阅链接是 base64 链接串，梦盒的「订阅链接」只吃 YAML，加不进去——请用下面这份 YAML 配置导入（自带防泄露规则，比裸订阅更好）。</div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };

  function randPass(n) {
    var c = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789', s = '';
    var a = new Uint32Array(n); crypto.getRandomValues(a);
    for (var i = 0; i < n; i++) s += c[a[i] % c.length];
    return s;
  }
  $('adminPass').value = randPass(16);

  function callNative(method, options) {
    return new Promise(function (resolve, reject) {
      if (!window.Capacitor || !window.Capacitor.toNative) {
        reject(new Error('原生桥未就绪（请在梦盒功能包里打开）'));
        return;
      }
      window.Capacitor.toNative('NodeForge', method, options || {}, {
        callback: function (res, err) {
          if (err) { reject(new Error(err.message || String(err))); return; }
          if (res && res.error) { reject(new Error(res.error.message || '调用失败')); return; }
          var data = res && ('data' in res) ? res.data : res;
          if (data && data.error) { reject(new Error(data.error)); return; }
          resolve(data || {});
        }
      });
    });
  }

  function copyText(t, btn) {
    function done() { var o = btn.textContent; btn.textContent = '已复制'; setTimeout(function () { btn.textContent = o; }, 1200); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(done).catch(function () { fallback(); });
    } else { fallback(); }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = t; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) {}
      document.body.removeChild(ta);
    }
  }

  var pollTimer = null;
  var lastOpts = null;
  var lastResult = null;

  function sanitizeSubId(s) {
    s = (s || '').replace(/[^A-Za-z0-9_-]/g, '');
    return s || 'node1';
  }

  function startPolling() {
    stopPolling();
    pollTimer = setInterval(pollOnce, 1500);
    pollOnce();
  }
  function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

  function pollOnce() {
    callNative('deployState', {}).then(function (st) {
      $('log').textContent = st.log || '';
      $('log').scrollTop = $('log').scrollHeight;
      if (st.done) {
        stopPolling();
        $('deployBtn').disabled = false;
        if (st.ok && st.result) {
          showResult(st.result);
        } else {
          $('log').innerHTML = '';
          $('log').textContent = (st.log || '') + '\n';
          var span = document.createElement('span');
          span.className = 'err';
          span.textContent = '部署失败：' + (st.error || '未知错误');
          $('log').appendChild(span);
        }
      }
    }).catch(function () { /* 轮询失败不打断 */ });
  }

  function buildVless(r) {
    if (r.vlessLink) return r.vlessLink;
    var name = encodeURIComponent(lastOpts.nodeName || r.subId);
    return 'vless://' + r.uuid + '@' + lastOpts.host + ':' + r.nodePort +
      '?security=reality&encryption=none&pbk=' + r.publicKey +
      '&fp=chrome&type=tcp&sni=' + r.sni + '&sid=' + r.shortId +
      '&flow=xtls-rprx-vision#' + name;
  }

  function showResult(r) {
    lastResult = r;
    var vless = buildVless(r);
    var sub = 'http://' + lastOpts.host + ':' + r.subPort + r.subPath + r.subId;
    var tunnel = 'ssh -L ' + r.panelPort + ':127.0.0.1:' + r.panelPort +
      (lastOpts.sshPort !== 22 ? ' -p ' + lastOpts.sshPort : '') +
      ' ' + lastOpts.sshUser + '@' + lastOpts.host;
    $('resultKv').innerHTML =
      '<b>订阅链接</b><br>' + sub + '<br>' +
      '<b>vless 链接</b><br>' + vless + '<br>' +
      '<b>面板</b>：http://127.0.0.1:' + r.panelPort + r.panelPath +
      '（先跑隧道命令再打开）<br>' +
      '<b>面板账号</b>：' + lastOpts.adminUser + ' / ' + lastOpts.adminPass + '<br>' +
      '<b>隧道命令</b>：' + tunnel;
    $('copyVless').onclick = function () { copyText(vless, this); };
    $('copySub').onclick = function () { copyText(sub, this); };
    $('copyTunnel').onclick = function () { copyText(tunnel, this); };
    fetch('template.yaml').then(function (res) { return res.text(); }).then(function (tpl) {
      var yaml = tpl
        .split('{{NODE_NAME}}').join(lastOpts.nodeName || r.subId)
        .split('{{SERVER}}').join(lastOpts.host)
        .split('{{PORT}}').join(String(r.nodePort))
        .split('{{UUID}}').join(r.uuid)
        .split('{{PUBLIC_KEY}}').join(r.publicKey)
        .split('{{SHORT_ID}}').join(r.shortId);
      $('yaml').value = yaml;
      $('copyYaml').onclick = function () { copyText(yaml, this); };
      $('dlYaml').onclick = function () {
        var btn = this;
        btn.disabled = true;
        callNative('saveTextFile', { name: r.subId + '-dreambox.yaml', text: yaml }).then(function (res) {
          btn.textContent = '已存到 ' + (res.path || 'Download');
        }).catch(function (e) {
          btn.disabled = false;
          btn.textContent = '保存失败，改用「复制配置」';
          alert('保存失败：' + (e && e.message ? e.message : e));
        });
      };
    });
    $('resultCard').classList.remove('hidden');
    $('resultCard').scrollIntoView({ behavior: 'smooth' });
  }

  $('deployBtn').addEventListener('click', function () {
    var opts = {
      host: $('host').value.trim(),
      sshPort: parseInt($('sshPort').value, 10) || 22,
      sshUser: $('sshUser').value.trim() || 'root',
      sshPassword: $('sshPassword').value,
      nodeName: $('nodeName').value.trim(),
      nodePort: parseInt($('nodePort').value, 10) || 443,
      subId: sanitizeSubId($('subId').value),
      adminUser: $('adminUser').value.trim() || 'sui',
      adminPass: $('adminPass').value
    };
    if (!opts.host) { alert('先填服务器 IP'); return; }
    if (!opts.sshPassword) { alert('先填 root 密码'); return; }
    if (!opts.adminPass) { alert('面板管理员密码不能为空'); return; }
    $('subId').value = opts.subId;
    lastOpts = opts;
    $('deployBtn').disabled = true;
    $('resultCard').classList.add('hidden');
    $('logCard').classList.remove('hidden');
    $('log').textContent = '';
    callNative('deploy', opts).then(function () {
      startPolling();
    }).catch(function (e) {
      $('deployBtn').disabled = false;
      $('log').textContent = '启动失败：' + e.message;
    });
  });

  // 进页面时若已有部署在跑/刚跑完（切出去又回来），接上状态
  callNative('deployState', {}).then(function (st) {
    if (st.running || (st.done && st.log)) {
      $('logCard').classList.remove('hidden');
      $('log').textContent = st.log || '';
      if (st.running) { $('deployBtn').disabled = true; startPolling(); }
      if (st.done) { pollOnce(); }
    }
  }).catch(function () {});
})();
</script>
</body>
</html>
