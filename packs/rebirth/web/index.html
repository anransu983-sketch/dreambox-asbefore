<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>轮回</title>
<style>
:root{--bg:#0d1512;--bg2:#122019;--card:#16241c;--border:#2c4636;--accent:#7fd08c;--accent2:#d4af37;--text:#e8f0e9;--sub:#9db4a4;--radius:16px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:14px 14px 40px}
.cover{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--border)}
.cover img{width:100%;height:170px;object-fit:cover;display:block}
.cover .shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(5,10,7,.82))}
.cover .tt{position:absolute;left:16px;bottom:12px}
.cover .tt .t1{font-size:26px;font-weight:900;letter-spacing:2px}
.cover .tt .t2{font-size:12px;color:var(--sub);margin-top:3px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-top:12px}
.card h2{font-size:16px;margin-bottom:8px}
.desc{font-size:13px;color:var(--sub);line-height:1.7}
b{color:var(--text)}
.gold{color:#fbbf24}
.ladrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.ladrow:last-child{border-bottom:none}
.pbtn{background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:999px;padding:8px 16px;font-size:14px;cursor:pointer}
.pbtn:disabled{opacity:.4}
.pbtn.primary{background:var(--accent);color:#0a120c;font-weight:800;border-color:var(--accent)}
input[type=number]{width:110px;padding:9px 10px;border-radius:12px;border:1px solid var(--border);background:var(--bg2);color:var(--text);font-size:16px;text-align:right}
.chipbtn{background:transparent;border:1px solid var(--border);color:var(--sub);border-radius:999px;padding:5px 10px;font-size:12px;cursor:pointer}
.err{color:#f87171;font-size:13px;min-height:18px;margin-top:8px}
.ok{color:#4ade80;font-size:13px;min-height:18px;margin-top:8px}
.big{font-size:20px;font-weight:900}
</style>
</head>
<body>
<div class="cover">
  <img src="world-youming.jpg" alt="">
  <div class="shade"></div>
  <div class="tt"><div class="t1">🗿 轮回</div><div class="t2" id="coverSub">一世成败皆成点 · 配点定下一世</div></div>
</div>
<div id="app"></div>
<div class="err" id="err"></div>
<div class="ok" id="ok"></div>
<script>
(function(){
"use strict";
function $(id){return document.getElementById(id)}
var hasBridge = !!(window.Capacitor && window.Capacitor.toNative);
var RANKS=["炼气","筑基","金丹","元婴","化神","炼虚","大乘"];
var ALLOC_DEFS=[
 {k:"gengu",icon:"🦴",name:"根骨",desc:"每 10 点：突破花费 -3%（上限 -50%）"},
 {k:"wuxing",icon:"💡",name:"悟性",desc:"资质悟性，功法神通的门槛与上限"},
 {k:"qiyun",icon:"🍀",name:"气运",desc:"奇遇更频、掉落更好、绝境逢生"},
 {k:"linggen",icon:"🌱",name:"灵根",desc:"30 点三灵根 · 120 点双灵根 · 300 点天灵根"},
 {k:"jiashi",icon:"🏯",name:"家世",desc:"每点 +50 开局灵石 · 150 点外门起步 · 300 点内门嫡系"},
 {k:"renyuan",icon:"🤝",name:"人缘",desc:"同门故人初始态度更亲近"}];
var ENDINGS=[
 {k:"bingjie",icon:"🗡️",name:"兵解",need:2,bonus:50,desc:"自斩此身，真灵遁入轮回。干脆利落，结算加成 +50。"},
 {k:"zuohua",icon:"🪷",name:"坐化",need:5,bonus:80,desc:"洞中坐化，肉身成舍利。圆满收官，结算加成 +80。"},
 {k:"feisheng",icon:"✨",name:"飞升",need:6,bonus:150,desc:"踏碎虚空，白日飞升。此世绝唱，结算加成 +150。"}];
var ENDING_NAMES={bingjie:"兵解",zuohua:"坐化",feisheng:"飞升"};
var state={sectId:"",points:0,earned:0,life:1,alloc:{gengu:0,wuxing:0,qiyun:0,linggen:0,jiashi:0,renyuan:0},pool:0,allocPending:false,rankIndex:0,rankName:"炼气",title:"杂役弟子",gradeName:"不入流",postEligibleIndex:-1,evalGrade:"D",evalMult:0.8,lifeLog:[],openingStones:0,seedArgb:0,themeMode:"Dark"};
var rbAlloc=null,rbEnding=null,rbOpening="";
function callNative(method,options){
  return new Promise(function(resolve,reject){
    if(!hasBridge){reject(new Error("no-bridge"));return}
    window.Capacitor.toNative("HostRebirth",method,options||{},{
      callback:function(res,err){
        if(err){reject(new Error(err.message||String(err)));return}
        if(res&&res.error){reject(new Error(res.error.message||"调用失败"));return}
        resolve(res||{});
      }
    });
  });
}
/* 浏览器预览兜底：无桥时 localStorage 模拟宿主轮回账本 */
function mockLoad(){try{var s=JSON.parse(localStorage.getItem("rebirthMock")||"{}");for(var k in s)state[k]=s[k]}catch(e){}mockDerive()}
function mockSave(){try{localStorage.setItem("rebirthMock",JSON.stringify(state))}catch(e){}}
function evalOf(earned,rank,postEl){var sc=(earned||0)+rank*300+(postEl+1)*200;if(sc>=6000)return{g:"S",m:1.5};if(sc>=4000)return{g:"A",m:1.3};if(sc>=2500)return{g:"B",m:1.15};if(sc>=1200)return{g:"C",m:1.0};return{g:"D",m:0.8}}
function mockDerive(){var ev=evalOf(state.earned,state.rankIndex||0,state.postEligibleIndex==null?-1:state.postEligibleIndex);state.evalGrade=ev.g;state.evalMult=ev.m;state.rankName=RANKS[state.rankIndex||0]}
function refreshState(){
  if(hasBridge){return callNative("state",{}).then(function(s){state=Object.assign(state,s);render()}).catch(function(e){$("err").textContent=e.message})}
  mockLoad();render();return Promise.resolve();
}
function allocSum(a){var n=0;ALLOC_DEFS.forEach(function(d){n+= (+a[d.k]||0)});return n}
function openingText(a){
  var fam=a.jiashi>=300?"圣地嫡系，出生便含着金汤匙":(a.jiashi>=120?"修仙世家子弟，族中有长辈照拂":(a.jiashi>=30?"小康之家，父母皆是散修":"散修之家，一贫如洗，全靠自己"));
  var root=a.linggen>=300?"天灵根现世，宗门抢人":(a.linggen>=120?"双灵根，资质上佳":(a.linggen>=30?"三灵根，中规中矩":"伪灵根开局，胜在路多"));
  var sp="";
  if(a.qiyun>=200&&a.gengu<=50)sp="【特殊开局 · 绝世废柴，气运冲天】根骨虽废，气运却浓得化不开——走路捡法宝，跳崖得传承。";
  else if(a.gengu>=200)sp="【特殊开局 · 天骄临世】根骨绝世，天劫也随之加重——这是伐天的命。";
  else if(a.wuxing>=200)sp="【特殊开局 · 悟性通天】过目不忘，一点就透，师长看你的眼神都不对了。";
  else if(a.renyuan>=200)sp="【特殊开局 · 天生亲和】人见人爱，连守山灵兽都愿意蹭你。";
  else if(ALLOC_DEFS.every(function(d){return (a[d.k]||0)>=100}))sp="【特殊开局 · 六边形战士】无一短板，中庸而全能。";
  return "第 "+state.life+" 世 —— "+fam+"；"+root+"。"+(sp||"这一世的路，要靠这一世的成就一步步挣出来。");
}
function render(){
  if(state.seedArgb){var hex="#"+("000000"+(state.seedArgb&0xFFFFFF).toString(16)).slice(-6);document.documentElement.style.setProperty("--accent",hex)}
  $("coverSub").textContent="第 "+state.life+" 世 · 一世成败皆成点 · 配点定下一世";
  var html="";
  if(!state.sectId){
    html+='<div class="card"><h2>账本未立</h2><div class="desc">轮回账本随门派而立：先去「高武门派」插件选一道、入了门，这里的世数、点数与碑林才会开始记。</div></div>';
    $("app").innerHTML=html;return;
  }
  var alloc=state.alloc||{};
  html+='<div class="card"><h2>📜 本世 · 第 '+state.life+' 世</h2>'
    +'<div class="desc">境界 <b>'+state.rankName+'</b> · 身份 <b>'+state.title+'</b> · 宗门 <b>'+state.gradeName+'</b><br>'
    +'本世功绩 <b>'+state.earned+'</b> · 可用轮回点 <b class="gold">'+state.points+'</b> · 此世评价 <b>'+state.evalGrade+'</b>（结算倍率 ×'+state.evalMult+'）</div>'
    +'<div class="desc" style="margin-top:4px">本世配点：'+ALLOC_DEFS.map(function(d){return d.icon+d.name+" "+(alloc[d.k]||0)}).join(" · ")+'</div></div>';
  if(state.allocPending){
    if(!rbAlloc)rbAlloc={gengu:0,wuxing:0,qiyun:0,linggen:0,jiashi:0,renyuan:0};
    var sum=allocSum(rbAlloc),left=state.pool-sum;
    html+='<div class="card"><h2>🗿 转世配点 · 点数自选</h2>'
      +'<div class="desc">上一世结算点池共 <b class="gold">'+state.pool+'</b> 点。想给哪一维加多少，自己填——没有等级上限，只有池子深浅。用不完的点带进这一世当余额；家世每点折 50 开局灵石，配完托管在本体，去门派包打开即到账。</div>'
      +ALLOC_DEFS.map(function(d){
        return '<div class="ladrow"><span style="font-size:20px">'+d.icon+'</span><span style="flex:1"><b>'+d.name+'</b><div class="desc">'+d.desc+'</div></span>'
        +'<input type="number" min="0" step="1" data-alloc="'+d.k+'" value="'+(rbAlloc[d.k]||0)+'"></div>'
        +'<div style="display:flex;gap:6px;justify-content:flex-end;padding:2px 0 4px">'
        +[10,50,100,500].map(function(n){return '<button class="chipbtn" data-add="'+d.k+':'+n+'">+'+n+'</button>'}).join("")
        +'<button class="chipbtn" data-add="'+d.k+':0">清零</button></div>'}).join("")
      +'<div class="desc" style="margin-top:6px">已配 <b>'+sum+'</b> 点 · 剩余 <b style="color:'+(left<0?'#f87171':'#4ade80')+'">'+left+'</b> 点'
      +(rbAlloc.jiashi>0?' · 开局灵石 <b class="gold">'+(rbAlloc.jiashi*50)+'</b>':"")+'</div>'
      +'<div class="desc" style="margin-top:6px">🌅 开局预览：'+openingText(rbAlloc)+'</div>'
      +'<button class="pbtn primary" id="btnAllocGo" style="margin-top:10px;width:100%"'+(left<0?" disabled":"")+'>踏入第 '+state.life+' 世</button></div>';
    $("app").innerHTML=html;
    Array.prototype.forEach.call(document.querySelectorAll("[data-alloc]"),function(inp){inp.addEventListener("input",function(){
      var v=parseInt(inp.value,10);if(isNaN(v)||v<0)v=0;rbAlloc[inp.getAttribute("data-alloc")]=v;render();
      var again=document.querySelector('[data-alloc="'+inp.getAttribute("data-alloc")+'"]');if(again){again.focus();again.select()}
    })});
    Array.prototype.forEach.call(document.querySelectorAll("[data-add]"),function(b){b.addEventListener("click",function(){
      var ps=b.getAttribute("data-add").split(":");var k=ps[0],n=+ps[1];
      rbAlloc[k]=n===0?0:((rbAlloc[k]||0)+n);render();
    })});
    var go=$("btnAllocGo");if(go)go.addEventListener("click",doAllocate);
    return;
  }
  if(rbOpening){
    html+='<div class="card"><h2>🌅 新的一世</h2><div class="desc" style="line-height:1.9">'+rbOpening+'</div>'
      +(state.openingStones>0?'<div class="desc" style="margin-top:6px">开局灵石 <b class="gold">'+state.openingStones+'</b> 已托管：打开「高武门派」即自动到账。</div>':"")
      +'<button class="pbtn" id="btnBack" style="margin-top:10px;width:100%">知道了</button></div>';
    $("app").innerHTML=html;
    $("btnBack").addEventListener("click",function(){rbOpening="";render()});
    return;
  }
  var ev=evalOf(state.earned,state.rankIndex,state.postEligibleIndex);
  html+='<div class="card"><h2>☠️ 此世结局（转世结算）</h2>'
    +'<div class="desc">结算点池 =（可用点 + 功绩一成）× 评价倍率 + 结局加成。转世之后：本世功绩、境界、职位、成就台账与门派包内进度清零重开；世数与这本碑林留下来。</div>'
    +ENDINGS.map(function(e){
      var ok=(state.rankIndex||0)>=e.need;
      var est=Math.round((state.points+state.earned*0.1)*ev.m)+e.bonus;
      return '<div class="ladrow"><span style="font-size:20px">'+e.icon+'</span><span style="flex:1"><b>'+e.name+'</b><div class="desc">需 '+RANKS[e.need]+' · '+e.desc+' 预计点池 '+est+'</div></span>'
      +(ok?'<button class="pbtn" data-ending="'+e.k+'">'+(rbEnding===e.k?"已选":"选此结局")+'</button>':'<span class="desc">未解锁</span>')+'</div>'}).join("")
    +(rbEnding?'<button class="pbtn primary" id="btnRebirthGo" style="margin-top:10px;width:100%">确认转世 · 迎接第 '+(state.life+1)+' 世</button>':'<div class="desc" style="margin-top:6px">先选一个结局，再确认转世。</div>')
    +'</div>';
  var log=state.lifeLog||[];
  html+='<div class="card"><h2>🪦 前世碑林（'+log.length+' 世）</h2>'
    +(log.length?log.slice().reverse().map(function(en){
      return '<div class="ladrow"><span style="font-size:20px">🗿</span><span style="flex:1"><b>第 '+en.life+' 世</b><div class="desc">'+(ENDING_NAMES[en.ending]||en.ending)+' · 评价 '+en.eval+' · 本世功绩 '+en.earned+' · 结算 '+en.pool+' 点</div></span></div>'}).join("")
      :'<div class="desc">尚无前世——你还在第一世。碑林会把每一世的结局、评价与结算都刻下来；前世结下的缘分（遗产回响），日后也会回到这一世。</div>')
    +'</div>';
  $("app").innerHTML=html;
  Array.prototype.forEach.call(document.querySelectorAll("[data-ending]"),function(b){b.addEventListener("click",function(){rbEnding=b.getAttribute("data-ending");render()})});
  var rg=$("btnRebirthGo");if(rg)rg.addEventListener("click",function(){doRebirth(rbEnding)});
}
function doRebirth(ending){
  if(!ending)return;
  $("err").textContent="";
  if(hasBridge){
    callNative("rebirth",{ending:ending}).then(function(s){state=Object.assign(state,s);rbEnding=null;rbAlloc=null;render()}).catch(function(e){$("err").textContent=e.message});
  }else{
    var e=null;ENDINGS.forEach(function(x){if(x.k===ending)e=x});
    if(!e||(state.rankIndex||0)<e.need)return;
    var ev=evalOf(state.earned,state.rankIndex,state.postEligibleIndex);
    var pool=Math.round((state.points+state.earned*0.1)*ev.m)+e.bonus;
    if(!state.lifeLog)state.lifeLog=[];
    state.lifeLog.push({life:state.life,ending:ending,eval:ev.g,earned:state.earned,pool:pool});
    state.pool=pool;state.life=(state.life||1)+1;state.allocPending=true;state.points=0;state.earned=0;state.rankIndex=0;
    rbEnding=null;rbAlloc=null;mockDerive();mockSave();render();
  }
}
function doAllocate(){
  if(!rbAlloc)return;
  var a={};ALLOC_DEFS.forEach(function(d){a[d.k]=Math.max(0,parseInt(rbAlloc[d.k],10)||0)});
  $("err").textContent="";
  if(hasBridge){
    callNative("allocate",{alloc:a}).then(function(s){state=Object.assign(state,s);rbOpening=openingText(a);rbAlloc=null;render()}).catch(function(e){$("err").textContent=e.message});
  }else{
    if(allocSum(a)>state.pool){$("err").textContent="点数不够";return}
    state.alloc=a;state.points=state.pool-allocSum(a);state.pool=0;state.allocPending=false;state.openingStones=(a.jiashi||0)*50;
    rbOpening=openingText(a);rbAlloc=null;mockDerive();mockSave();render();
  }
}
refreshState();
})();
</script>
</body>
</html>
